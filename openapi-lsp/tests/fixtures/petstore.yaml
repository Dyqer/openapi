openapi: "3.0.3"
info:
  title: Demo API
  version: "1.0.0"
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
        name:
          $ref: "./pet.yaml#/PetName"
    Error:
      type: object
      properties:
        message:
          type: string
